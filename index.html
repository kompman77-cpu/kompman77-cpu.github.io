<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b1020" />
    <title>Курьер-экспресс</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0b1020; }
      #root { height: 100dvh; }
      #root > div { height: 100dvh !important; max-height: 100dvh !important; }
      /* экраны (меню/пауза/гейм-овер) влезают в видимую область, при нехватке — прокрутка внутри */
      #root .min-h-screen {
        min-height: 100dvh !important;
        height: 100dvh !important;
        max-height: 100dvh !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
        justify-content: flex-start !important;
      }
      /* декоративные слои не ловят касания */
      #root .pointer-events-none { pointer-events: none !important; }
      #root canvas { pointer-events: none !important; touch-action: none; }
      /* интерфейс ужат на маленьких экранах (Tailwind считаем в rem) */
      html { font-size: 14px; }
      @media (max-height: 820px) { html { font-size: 13px; } }
      @media (max-height: 740px) { html { font-size: 12px; } }
      @media (max-height: 660px) { html { font-size: 11px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // полноэкранный режим: по первому касанию (Android), с тихим отказом (iOS)
      (function () {
        var done = false;
        document.addEventListener('pointerdown', function () {
          if (done) return; done = true;
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) req.call(el).catch(function () {});
        }, { once: true, passive: true });
      })();
      // бейдж версии
      (function () {
        var b = document.createElement('div');
        b.textContent = 'v5 · русский · быстрый цикл';
        b.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99999;background:#16a34a;color:#fff;font:600 11px sans-serif;padding:4px 8px;border-radius:6px;opacity:.9;pointer-events:none';
        document.body.appendChild(b);
        setTimeout(function () { b.style.transition = 'opacity 1s'; b.style.opacity = '0'; }, 5000);
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CvdEta2R.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BQCkql1O.css" />
  </body>
</html>
